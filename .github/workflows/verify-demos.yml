name: Verify live MCC demos
on:
  push:
    branches: [main]
    paths: ['qa/verify-live.cjs', '.github/workflows/verify-demos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/verify-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcc-demo-qa
          path: qa-results/
          retention-days: 14
