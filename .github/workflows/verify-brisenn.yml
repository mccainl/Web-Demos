name: Verify BRISENN experience
on:
  workflow_run:
    workflows: [Publish MCC Web-Demos]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install chromium
      - run: node qa/verify-brisenn.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brisenn-experience-qa
          path: brisenn-qa/
          retention-days: 14
