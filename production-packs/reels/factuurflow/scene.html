</style><div id="grain"></div><div class="brand">MCC <span>AI</span></div><div class="edition">CONCEPT / 02</div><div id="heading"><div id="kicker"></div><h1 id="title"></h1></div><div id="shadow"></div><div id="stage"><div id="world"><div id="floor"></div><div id="ring"></div></div></div><div id="metric"></div><div id="note"></div><div id="cta"><div class="cta-title">Jouw proces.<br><em>Meer controle.</em></div><div class="cta-link">Probeer FactuurFlow.<br>Lees het projectartikel op mccai.nl.</div><div class="cta-button">DM CLONE ↗</div></div><div id="progress"></div><div id="footer"><span>WERKENDE DEMO · GESIMULEERDE DATA</span><span>@mccai.nl</span></div>
<script>
const $=s=>document.getElementById(s), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t;
const defs=[['hero',900],['intake',480],['discrepancy',510],['correction',640],['checked',640],['approved',640],['stats',650],['audit',650]];
const panels={};for(const [id,w]of defs){let e=document.createElement('div');e.className='panel';e.style.width=w+'px';e.innerHTML='<div class="face"><div class="chrome"><i></i><i></i><i></i><span>factuurflow / werkende conceptdemo</span></div><img src="'+id+'.png"><div class="shine"></div></div>'; $('world').append(e);panels[id]=e}
function panel(id,x,y,z,rx,ry,rz,s,op=1){let p=panels[id];p.style.transform='translate(-50%,-50%) translate3d('+x+'px,'+y+'px,'+z+'px) rotateX('+rx+'deg) rotateY('+ry+'deg) rotateZ('+rz+'deg) scale('+s+')';p.style.opacity=clamp(op);p.style.visibility=op<=0?'hidden':'visible';p.querySelector('.shine').style.background='linear-gradient('+(115+ry)+'deg,transparent 35%,#fff2 49%,transparent 63%)'}
const beats=[
[0,6,'FACTUUR / FLOW','De factuur.<br><em>In beweging.</em>','Een werkend concept voor intake, controle en beoordeling.'],
[6,12,'01 / INTAKE','Van document<br><em>naar inzicht.</em>','Een fictieve leveranciersfactuur gaat de workflow in.'],
[12,18,'02 / CONTROLE','Het verschil.<br><em>Direct zichtbaar.</em>','De demo rekent na en markeert het afwijkende totaal.'],
[18,25,'03 / BEOORDELING','Jij houdt<br><em>de regie.</em>','De eigenaar corrigeert en controleert vóór goedkeuring.'],
[25,31,'04 / GOEDKEURING','Gecontroleerd.<br><em>Vastgelegd.</em>','De status en het auditlog worden bijgewerkt.'],
[31,38,'GEBOUWD DOOR MCC','Automatisering.<br><em>Met aandacht.</em>','Demo + artikel beschikbaar. Vraag MCC om jouw versie.']
];
window.render=t=>{
for(const id in panels)panels[id].style.visibility='hidden';
const idx=beats.findIndex(b=>t>=b[0]&&t<b[1]),b=beats[Math.max(0,idx)],u=(t-b[0])/(b[1]-b[0]),intro=ease((t-b[0])/.75);
$('kicker').textContent=b[2];$('title').innerHTML=b[3];$('note').textContent=b[4];
$('heading').style.opacity=.35+.65*intro;$('heading').style.transform='translateY('+((1-intro)*22)+'px)';
$('world').style.transform='rotateY('+(Math.sin(t*.16)*3)+'deg)';
$('ring').style.transform='rotateX(70deg) rotateZ('+(t*8)+'deg) translateZ(-180px)';
$('progress').style.transform='scaleX('+t/38+')';$('metric').style.opacity=0;$('cta').style.opacity=0;
if(idx===0){
const k=ease(u);panel('hero',0,-10,lerp(-450,0,k),lerp(26,8,k),lerp(-30,-10,k),lerp(-9,-3,k),lerp(.62,.71,k));
panel('discrepancy',220,165,90,8,-16,8,.41,ease((t-2.0)/1.3));panel('stats',-220,220,170,12,10,-6,.48,ease((t-3.1)/1.2));
}
if(idx===1){
panel('hero',-210,70,-380,18,-24,-8,.65,.22);
panel('intake',lerp(180,-25,intro),-18,lerp(-260,70,intro),lerp(22,2,intro),lerp(-34,-6,ease(u)),lerp(9,-2,intro),.94);
}
if(idx===2){
panel('intake',-180,60,-260,15,-22,-7,.7,.32);
panel('discrepancy',lerp(170,0,intro),-60,lerp(-100,100,intro),8-6*u,lerp(-20,4,ease(u)),-2,.98);
$('metric').innerHTML='€ 79,65<small>VERSCHIL IN DIT FICTIEVE VOORBEELD</small>';$('metric').style.opacity=ease((u-.18)*4);
}
if(idx===3){
panel('discrepancy',-120,-110,-300,16,-22,-6,.72,.25);
const change=ease((t-21.7)/.85);
panel('correction',lerp(220,0,intro),-50-45*change,50,12-10*u,-9+12*u,-2,.91,1-change);
panel('checked',0,100*(1-change)-50,100,6-5*change,8*(1-change),0,.91,change);
$('metric').innerHTML='€ 405,35<small>HERBEREKEND · DOOR EIGENAAR BEOORDEELD</small>';$('metric').style.opacity=ease((u-.3)*3);
}
if(idx===4){
panel('approved',0,lerp(-120,-165,intro),100,6,-7+10*u,-1,.9,intro);
panel('stats',0,70,160,10,-4,0,.9,ease((t-25.5)/.9));
panel('audit',0,245,80,10,3,1,.9,ease((t-26.2)/.9));
}
if(idx===5){
let q=ease(u);panel('hero',80,180,-100,18,-18+10*q,-5,.46,.30);
panel('approved',-130,220,100,10,-7,3,.42,.45);
$('cta').style.opacity=intro;$('cta').style.transform='translateY('+(25*(1-intro))+'px)';
$('note').style.opacity=1;
}
};
render(0);
</script>
