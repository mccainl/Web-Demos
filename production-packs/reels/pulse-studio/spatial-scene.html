</style><div id="grain"></div><div class="brand">MCC <span>AI</span></div><div class="edition">CONCEPT / 05</div><div id="heading"><div id="kicker"></div><h1 id="title"></h1></div><div id="shadow"></div><div id="stage"><div id="world"><div id="floor"></div><div id="ring"></div></div></div><div id="metric"></div><div id="note"></div><div id="cta"><div class="cta-title">Jouw studio.<br><em>Jouw ritme.</em></div><div class="cta-link">Probeer Pulse Studio.<br>Lees het projectartikel op mccai.nl.</div><div class="cta-button">DM CLONE ↗</div></div><div id="progress"></div><div id="footer"><span>WERKENDE DEMO · GESIMULEERDE DATA</span><span>@mccai.nl</span></div>
<script>const config={"slug":"pulse-studio","name":"Pulse Studio","category":"Website","theme":"navy","head":["Meer bewegen.<br><em>Minder regelen.</em>","Vind jouw<br><em>ritme.</em>","Een les.<br><em>Een plek.</em>","Deelnemers.<br><em>In overzicht.</em>","Een wijziging?<br><em>Bijgewerkt.</em>"],"notes":["Een studiowebsite met een werkende lesboekingsdemo.","Ontdek de lessen en kies wat bij je past.","De deelnemer reserveert een plaats met fictieve gegevens.","De eigenaar ziet de boeking en de bezetting.","Bij annulering komt de plaats weer vrij in de demo."],"cta":"Jouw studio.<br><em>Jouw ritme.</em>"};

const $=s=>document.getElementById(s), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t;
const panels={}, dims={};
for(const id of ['hero','detail','intake','owner','done','stats']){
 const e=document.createElement('div');e.className='panel';e.innerHTML='<div class="face"><div class="chrome"><i></i><i></i><i></i><span>'+config.name.toLowerCase()+' / werkende conceptdemo</span></div><img src="'+id+'.png"><div class="shine"></div></div>';
 $('world').append(e);panels[id]=e;
}
window.prepare=async()=>{for(const id in panels){const im=panels[id].querySelector('img');await im.decode();const aspect=im.naturalWidth/im.naturalHeight;const w=id==='hero'?900:Math.min(600,490*aspect);panels[id].style.width=w+'px';dims[id]={w,h:w/aspect+28};}};
function panel(id,x,y,z,rx,ry,rz,s,op=1){let p=panels[id];p.style.transform='translate(-50%,-50%) translate3d('+x+'px,'+y+'px,'+z+'px) rotateX('+rx+'deg) rotateY('+ry+'deg) rotateZ('+rz+'deg) scale('+s+')';p.style.opacity=clamp(op);p.style.visibility=op<=0?'hidden':'visible';p.querySelector('.shine').style.background='linear-gradient('+(115+ry)+'deg,transparent 35%,#fff2 49%,transparent 63%)'}
const bounds=[0,6,12,18,25,31,38],labels=[config.name.toUpperCase(),'01 / ONTDEKKEN','02 / AANVRAGEN','03 / OVERZICHT','04 / VERVOLG','GEBOUWD DOOR MCC'];
window.render=t=>{
for(const id in panels)panels[id].style.visibility='hidden';
let idx=0;while(idx<5&&t>=bounds[idx+1])idx++;
let u=(t-bounds[idx])/(bounds[idx+1]-bounds[idx]),intro=ease((t-bounds[idx])/.8),sign=config.slug.length%2?1:-1;
$('kicker').textContent=labels[idx];$('title').innerHTML=idx<5?config.head[idx]:'Gebouwd voor<br><em>jouw onderneming.</em>';
$('title').style.fontSize=config.slug==='leadpilot'&&idx===0?'58px':'62px';
$('note').textContent=idx<5?config.notes[idx]:'Probeer de demo. Lees het artikel. DM CLONE.';
$('heading').style.opacity=.35+.65*intro;$('heading').style.transform='translateY('+((1-intro)*22)+'px)';
$('world').style.transform='rotateY('+(Math.sin(t*.16)*3)+'deg)';$('ring').style.transform='rotateX(70deg) rotateZ('+(t*8*sign)+'deg) translateZ(-180px)';
$('progress').style.transform='scaleX('+t/38+')';$('metric').style.opacity=0;$('cta').style.opacity=0;
if(idx===0){let k=ease(u);panel('hero',0,-10,lerp(-450,0,k),lerp(26,8,k),sign*lerp(-30,-10,k),sign*lerp(-9,-3,k),lerp(.62,.71,k));panel('detail',sign*200,160,100,8,sign*-16,sign*8,.43,ease((t-2)/1.3));panel('stats',sign*-210,230,150,12,sign*10,sign*-6,.44,ease((t-3.1)/1.2));}
if(idx===1){panel('hero',sign*-180,90,-380,18,sign*-24,sign*-8,.65,.18);panel('detail',sign*lerp(180,0,intro),-15,lerp(-260,70,intro),lerp(22,2,intro),sign*lerp(-24,5,ease(u)),sign*lerp(9,-2,intro),1);}
if(idx===2){panel('detail',sign*-190,80,-260,15,sign*-22,sign*-7,.7,.22);panel('intake',sign*lerp(170,0,intro),-40,lerp(-150,70,intro),8-6*u,sign*lerp(-20,4,ease(u)),sign*-2,1);}
if(idx===3){panel('intake',sign*-130,-100,-300,16,sign*-22,sign*-6,.72,.18);panel('owner',sign*lerp(200,0,intro),-30,70,12-10*u,sign*(-9+12*u),-2,1);panel('stats',0,Math.min(280,dims.owner.h*.5+90),50,10,-4,0,.9,(dims.owner.h>350||config.slug==='pulse-studio')?0:ease((u-.30)*3));}
if(idx===4){const h=dims.done.h;panel('done',0,lerp(70,-45,intro),100,6,sign*(-7+10*u),sign*-1,1,intro);panel('stats',0,Math.min(280,h*.5+50),80,10,sign*-4,0,.9,h>350?0:ease((t-25.8)/.9));}
if(idx===5){let q=ease(u);panel('hero',80,180,-100,18,sign*(-18+10*q),-5,.46,.30);panel('done',-130,220,100,10,-7,3,.42,.45);$('cta').style.opacity=intro;$('cta').style.transform='translateY('+(25*(1-intro))+'px)';}
};
</script>
